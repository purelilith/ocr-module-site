<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Распознавание текста</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="card">
    <h1>Текст с фотографии</h1>
    <p class="subtitle">Загрузите фото с русским текстом, и мы его распознаем</p>

    <input type="file" id="fileInput" accept=".jpg,.jpeg,.png,.webp,.bmp,.pdf" hidden>
    <label for="fileInput" class="btn">📷 Выбрать фото</label>
    <p id="fileName" class="file-name"></p>

    <img id="preview" class="preview" alt="" hidden>

    <div style="margin-bottom: 15px; text-align: left;">
      <label for="questionInput" style="font-size: 14px; color: #7a7894; display: block; margin-bottom: 5px;">Вопрос по документу:</label>
      <input type="text" id="questionInput" placeholder="Например: Все ли в порядке с документом?" style="width: 100%; padding: 10px; border: 2px solid #e3e1f0; border-radius: 8px; font-size: 14px;">
    </div>

    <button id="recognizeBtn" class="btn btn-main" disabled>Распознать текст</button>

    <h2>Результат</h2>
    <textarea id="result" readonly
      placeholder="Здесь появится распознанный текст..."></textarea>
  </main>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
